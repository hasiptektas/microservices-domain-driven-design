server:
  port: 8080

spring:
  application:
    name: interaction-service
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:interactiondb}
    username: ${DB_USER:interaction}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

kafka:
  bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
  topic:
    post-liked: post-liked-events
    post-shared: post-shared-events
    user-followed: user-followed-events

logging:
  level:
    com.example.interaction: DEBUG
    org.springframework.kafka: INFO 