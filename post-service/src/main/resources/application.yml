server:
  port: 8080

spring:
  application:
    name: post-service
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:postdb}
    username: ${DB_USER:post}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

kafka:
  bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
  topic:
    post-created: post-created-events
    user-mentioned: user-mentioned-events

aws:
  s3:
    bucket: ${S3_BUCKET:instagram-media-bucket}
    region: us-east-1

logging:
  level:
    com.example.post: DEBUG
    org.springframework.kafka: INFO 