server:
  port: 8080

spring:
  application:
    name: feed-service

  redis:
    host: ${REDIS_HOST:localhost}
    port: 6379
    timeout: 2000ms

kafka:
  bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
  topic:
    post-created: post-created-events
    post-liked: post-liked-events
    user-followed: user-followed-events

logging:
  level:
    com.example.feed: DEBUG
    org.springframework.kafka: INFO
    org.springframework.data.redis: INFO 