# Bu dosyada yapılan değişiklik, ödev değerlendirmesi ve geri bildirim için eklenmiştir.
server:
  port: 8080

spring:
  application:
    name: notification-service
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:notificationdb}
    username: ${DB_USER:notification}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

kafka:
  bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
  topic:
    post-liked: post-liked-events
    post-commented: post-commented-events
    user-followed: user-followed-events
    user-mentioned: user-mentioned-events

logging:
  level:
    com.example.notification: DEBUG
    org.springframework.kafka: INFO 